<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Road to Freedom | Debt Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen pb-12">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-bold text-white tracking-wide">Road to Freedom</h1>
        <p class="text-xs text-slate-400">Financial Independence Tracker</p>
      </div>
      <button onclick="toggleModal('debtModal')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm px-4 py-2 rounded-lg transition-colors">
        + Add Debt
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-6 space-y-6">

    <!-- Overview Cards -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      
      <!-- Card 1: Total Original Debt -->
      <div class="bg-slate-800/80 border border-slate-700/50 rounded-xl p-4 flex flex-col justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-400">Total Original Debt</p>
          <h2 id="totalOriginalText" class="text-2xl font-bold text-white mt-1">£0.00</h2>
        </div>
        <span class="inline-flex items-center text-xs text-slate-400 mt-3">
          Baseline SFS Portfolio
        </span>
      </div>

      <!-- Card 2: Total Paid So Far -->
      <div class="bg-slate-800/80 border border-emerald-500/30 rounded-xl p-4 flex flex-col justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-400">Total Paid So Far</p>
          <h2 id="totalPaidText" class="text-2xl font-bold text-emerald-400 mt-1">£0.00</h2>
        </div>
        <span id="paidPercentageText" class="inline-flex items-center text-xs text-emerald-400 mt-3 font-medium">
          0% Cleared
        </span>
      </div>

      <!-- Card 3: Remaining Balance -->
      <div class="bg-slate-800/80 border border-amber-500/30 rounded-xl p-4 flex flex-col justify-between">
        <div>
          <p class="text-xs font-semibold uppercase text-slate-400">Remaining Balance</p>
          <h2 id="totalRemainingText" class="text-2xl font-bold text-amber-400 mt-1">£0.00</h2>
        </div>
        <span id="remainingCountText" class="inline-flex items-center text-xs text-amber-400 mt-3 font-medium">
          0 Active Debts
        </span>
      </div>

    </section>

    <!-- Overall Progress Bar -->
    <section class="bg-slate-800/80 border border-slate-700/50 rounded-xl p-4">
      <div class="flex justify-between items-center text-xs text-slate-400 mb-2 font-medium">
        <span>Overall Payoff Progress</span>
        <span id="overallBarPercent">0%</span>
      </div>
      <div class="w-full bg-slate-700/50 rounded-full h-3 overflow-hidden">
        <div id="overallBarInner" class="bg-emerald-500 h-full transition-all duration-500" style="width: 0%"></div>
      </div>
    </section>

    <!-- Debt List -->
    <section class="bg-slate-800/80 border border-slate-700/50 rounded-xl p-4">
      <h3 class="text-lg font-bold text-white mb-4">Your Debts</h3>
      <div id="debtContainer" class="space-y-4">
        <!-- Dynamic content rendered via JS -->
      </div>
    </section>

  </main>

  <!-- Modal: Add New Debt -->
  <div id="debtModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-xl max-w-md w-full p-6 space-y-4">
      <h3 class="text-lg font-bold text-white">Add New Account/Debt</h3>
      <form id="debtForm" onsubmit="handleSaveDebt(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Account / Creditor Name</label>
          <input type="text" id="debtName" required placeholder="e.g. Credit Card, Loan" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Original Amount (£)</label>
          <input type="number" step="0.01" id="debtOriginal" required placeholder="1000.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1">Current Balance (£)</label>
          <input type="number" step="0.01" id="debtCurrent" required placeholder="1000.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="toggleModal('debtModal')" class="px-4 py-2 text-sm text-slate-400 hover:text-white">Cancel</button>
          <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm px-4 py-2 rounded-lg">Save Debt</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    let debts = JSON.parse(localStorage.getItem('road_to_freedom_debts')) || [];

    function saveAndRender() {
      localStorage.setItem('road_to_freedom_debts', JSON.stringify(debts));
      renderDashboard();
    }

    function toggleModal(modalId) {
      const modal = document.getElementById(modalId);
      modal.classList.toggle('hidden');
    }

    function handleSaveDebt(event) {
      event.preventDefault();
      const name = document.getElementById('debtName').value;
      const original = parseFloat(document.getElementById('debtOriginal').value) || 0;
      const current = parseFloat(document.getElementById('debtCurrent').value) || 0;

      debts.push({
        id: Date.now(),
        name,
        original,
        current
      });

      document.getElementById('debtForm').reset();
      toggleModal('debtModal');
      saveAndRender();
    }

    function logPayment(id) {
      const amount = prompt("Enter payment amount (£):");
      if (!amount || isNaN(amount) || amount <= 0) return;

      const debt = debts.find(d => d.id === id);
      if (debt) {
        debt.current = Math.max(0, debt.current - parseFloat(amount));
        saveAndRender();
      }
    }

    function deleteDebt(id) {
      if (confirm("Are you sure you want to remove this account?")) {
        debts = debts.filter(d => d.id !== id);
        saveAndRender();
      }
    }

    function renderDashboard() {
      let totalOriginal = 0;
      let totalRemaining = 0;

      debts.forEach(debt => {
        totalOriginal += debt.original;
        totalRemaining += debt.current;
      });

      const totalPaid = Math.max(0, totalOriginal - totalRemaining);
      const paidPercent = totalOriginal > 0 ? ((totalPaid / totalOriginal) * 100).toFixed(1) : 0;
      const activeCount = debts.filter(d => d.current > 0).length;

      // Update Top Metrics
      document.getElementById('totalOriginalText').innerText = `£${totalOriginal.toLocaleString('en-GB', { minimumFractionDigits: 2 })}`;
      document.getElementById('totalPaidText').innerText = `£${totalPaid.toLocaleString('en-GB', { minimumFractionDigits: 2 })}`;
      document.getElementById('totalRemainingText').innerText = `£${totalRemaining.toLocaleString('en-GB', { minimumFractionDigits: 2 })}`;
      document.getElementById('paidPercentageText').innerText = `${paidPercent}% Cleared`;
      document.getElementById('remainingCountText').innerText = `${activeCount} Active Debt${activeCount !== 1 ? 's' : ''}`;

      // Update Overall Progress Bar
      document.getElementById('overallBarPercent').innerText = `${paidPercent}%`;
      document.getElementById('overallBarInner').style.width = `${paidPercent}%`;

      // Render Debt List
      const container = document.getElementById('debtContainer');
      if (debts.length === 0) {
        container.innerHTML = `<p class="text-sm text-slate-400 text-center py-6">No debt accounts added yet. Click "+ Add Debt" to begin.</p>`;
        return;
      }

      container.innerHTML = debts.map(debt => {
        const paid = Math.max(0, debt.original - debt.current);
        const percent = debt.original > 0 ? ((paid / debt.original) * 100).toFixed(1) : 0;
        
        return `
          <div class="bg-slate-900/60 border border-slate-700/60 rounded-lg p-4 space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <h4 class="font-bold text-white text-base">${debt.name}</h4>
                <p class="text-xs text-slate-400">Remaining: £${debt.current.toLocaleString('en-GB', { minimumFractionDigits: 2 })} / £${debt.original.toLocaleString('en-GB', { minimumFractionDigits: 2 })}</p>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="logPayment(${debt.id})" class="bg-emerald-600/20 hover:bg-emerald-600/40 text-emerald-400 text-xs px-3 py-1.5 rounded border border-emerald-500/30 transition-colors">
                  + Pay
                </button>
                <button onclick="deleteDebt(${debt.id})" class="text-slate-500 hover:text-rose-400 text-xs px-2 py-1 transition-colors">
                  Delete
                </button>
              </div>
            </div>
            
            <div>
              <div class="flex justify-between text-xs text-slate-400 mb-1">
                <span>Paid: £${paid.toLocaleString('en-GB', { minimumFractionDigits: 2 })}</span>
                <span>${percent}%</span>
              </div>
              <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
                <div class="bg-emerald-500 h-full" style="width: ${percent}%"></div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Initial load
    renderDashboard();
  </script>
</body>
</html>
